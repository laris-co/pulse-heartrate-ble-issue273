name: PulseHeartRateBLE
options:
  bundleIdPrefix: co.laris
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  PulseHeartRateBLE:
    type: application
    platform: iOS
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pulse HR Diagnostic
        NSBluetoothAlwaysUsageDescription: Scan for and connect to a heart-rate sensor you select, then display live measurements while this app is in the foreground.
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: Sources/App
      - path: Sources/HeartRateParser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.laris.PulseHeartRateBLE
        PRODUCT_NAME: PulseHeartRateBLE
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 6K28WEXX78
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - PulseHeartRateBLEUITests
  PulseHeartRateBLEUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/PulseHeartRateBLEUITests
    dependencies:
      - target: PulseHeartRateBLE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.laris.PulseHeartRateBLEUITests
        DEVELOPMENT_TEAM: 6K28WEXX78
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

name: Pulse
options:
  bundleIdPrefix: co.laris
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages:
  ConnectIQ:
    url: https://github.com/garmin/connectiq-companion-app-sdk-ios.git
    revision: f0d29ff691d700a132d86205ed9bb091e336c2f7
targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: ../ios/Sources/App/HeartRateBluetoothManager.swift
      - path: ../ios/Sources/HeartRateParser
    dependencies:
      - package: ConnectIQ
        product: ConnectIQ
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pulse
        NSBluetoothAlwaysUsageDescription: Pulse connects to the heart-rate sensor you choose to animate your live pulse. Readings stay on this device.
        CFBundleURLTypes:
          - CFBundleURLName: co.laris.PulseLive.connectiq
            CFBundleURLSchemes:
              - pulselive-ciq
        LSApplicationQueriesSchemes:
          - gcm-ciq
        NSBluetoothPeripheralUsageDescription: Pulse connects to the watch you select to show your heart rate locally.
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        'UISupportedInterfaceOrientations~ipad':
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.laris.PulseLive
        PRODUCT_NAME: Pulse
        TARGETED_DEVICE_FAMILY: '1,2'
        DEVELOPMENT_TEAM: 6K28WEXX78
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - PulseUITests

  PulseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Pulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.laris.PulseLiveUITests
        DEVELOPMENT_TEAM: 6K28WEXX78
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
